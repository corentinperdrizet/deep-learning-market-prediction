services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data/artifacts:/app/data/artifacts:ro
      - ./data/processed:/app/data/processed:ro
      - ./experiments/figures:/app/experiments/figures:ro
    command:
      [
        "streamlit",
        "run",
        "src/app/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/artifacts:/app/data/artifacts:ro
    command: ["uvicorn", "src.serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
